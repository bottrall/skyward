require:
  - ./lint/rubocop/cop/local/no_inheritance
  - ./lint/rubocop/cop/local/no_mocking
  - ./lint/rubocop/cop/local/no_raw_sql
  - ./lint/rubocop/cop/local/require_disable_reason
  - ./lint/rubocop/cop/local/typed_constant_alias

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  # The oldest Ruby that isn't end-of-life.
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - ".claude/**/*"
    - "bin/**/*"
    - "**/sig/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "*/vendor/**/*"

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/RedundantLineBreak:
  Enabled: true
  InspectBlocks: false

Metrics:
  Enabled: false

Metrics/BlockNesting:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 1

Local/NoInheritance:
  Enabled: true
  AllowedParents:
    - Skyward::API
    - Skyward::Record
  Include:
    - "*/lib/**/*.rb"
    - "**/test/**/*.rb"

Local/NoMocking:
  Enabled: true
  Include:
    - "**/test/**/*_test.rb"

Local/NoRawSql:
  Enabled: true
  Exclude:
    - "skyward-orm/**/*"

Local/RequireDisableReason:
  Enabled: true

Local/TypedConstantAlias:
  Enabled: true
  Include:
    - "*/lib/**/*.rb"

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    # The gemspec loads version.rb before the namespace exists.
    - "*/lib/skyward/*/version.rb"
    # The cop files define the `Local` department itself, which the compact
    # form can't open.
    - "lint/rubocop/**/*"

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self

# A gem's entry file opens Skyward beside its own class to add the gem's
# methods on Skyward itself (Skyward.app, Skyward.connect).
Style/OneClassPerFile:
  AllowedClasses:
    - Skyward

# Matches the READMEs, which are the spec.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
