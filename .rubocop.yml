require:
  - ./lint/rubocop/cop/local/no_raw_sql
  - ./lint/rubocop/cop/local/typed_constant_alias

plugins:
  - rubocop-bottrall

inherit_gem:
  rubocop-bottrall:
    - config/base.yml
    - config/rbs-inline.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  # The oldest Ruby that isn't end-of-life.
  TargetRubyVersion: 3.3
  Exclude:
    - '*/vendor/**/*'
    - 'examples/*/vendor/**/*'
    # The README's opening example, copied as it's written so a test can run it.
    - 'skyward-api/test/fixtures/hello/config.ru'

Bottrall/NoInheritance:
  AllowedParents:
    - Skyward::API
    - Skyward::ORM::Record
  Include:
    - '*/lib/**/*.rb'
    - 'examples/*/**/*.rb'
    - '**/test/**/*.rb'

Bottrall/NoMocking:
  OwnedNamespaces:
    - Skyward
  Include:
    - '**/test/**/*_test.rb'

Local/NoRawSql:
  Enabled: true
  Exclude:
    - 'skyward-orm/**/*'

Local/TypedConstantAlias:
  Enabled: true
  Include:
    - '*/lib/**/*.rb'
    - 'examples/*/**/*.rb'

Style/ClassAndModuleChildren:
  Exclude:
    # The gemspec loads version.rb before the namespace exists.
    - '*/lib/skyward/*/version.rb'
    # The cop files define the `Local` department itself, which the compact
    # form can't open.
    - 'lint/rubocop/**/*'

# A gem's entry file opens Skyward beside its own class to add the gem's
# methods on Skyward itself (Skyward.app, Skyward.connect).
Style/OneClassPerFile:
  AllowedClasses:
    - Skyward
