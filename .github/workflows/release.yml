name: release

# Pushing a vX.Y.Z tag publishes every gem at that version. bin/release
# prepares the version bump and changelog.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Each gem's trusted publisher on RubyGems names this workflow and
    # environment, so no API key is stored here.
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake release:verify
      - run: bundle exec rake package:check
      # RubyGems lets trusted publishing create a new gem only when the token
      # exchange names the account that will own it, and no release of
      # rubygems/configure-rubygems-credentials sends that `owner` yet.
      - name: Exchange the OIDC token for a RubyGems API key
        env:
          # bottrall's RubyGems.org user ID.
          RUBYGEMS_OWNER: "240211"
        shell: bash
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          response=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -sS -X POST -H "Content-Type: application/json" --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          key=$(jq -r '.rubygems_api_key // empty' <<<"$response")
          if [[ -z $key ]]; then
            echo "::error::RubyGems refused the token exchange: ${response}"
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "$GITHUB_ENV"
      # In dependency order, so each gem's exact pins resolve once it's live.
      - run: |
          for gem in skyward-core skyward-api skyward-orm skyward; do
            gem push "pkg/${gem}-${GITHUB_REF_NAME#v}.gem"
          done
