# Each push to main updates release-please's release PR. Merging that PR
# creates the vX.Y.Z release, and this workflow then publishes every gem and
# attaches a run of bin/bench to the release.
# Publishing lives here rather than on a `release` event because releases
# created with the default GITHUB_TOKEN don't trigger other workflows. Each
# gem's RubyGems trusted publisher is pinned to this file name and the
# `release` environment; change either and publishing stops.

name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # release-please bumps every version.rb, but each lockfile records the
  # Skyward gems' versions too, and CI installs from the lockfiles in frozen
  # mode, so the release PR needs them updated to pass.
  lockfiles:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: ruby/setup-ruby@v1
      - run: |
          for dir in . skyward-core skyward-api skyward-orm skyward examples/todos examples/todos_postgres benchmarks; do
            (cd "$dir" && bundle lock)
          done
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update the lockfiles to the new version"
          git push

  # The publish job can mint a RubyGems API key, so it runs none of the dev
  # bundle's gems: the checks that need them run here, unprivileged, and
  # publish then builds the gems itself with plain RubyGems.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake "release:verify[${TAG}]"
      - run: bin/build

  publish:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      # Mirrors rake release:verify, which can't run here: the Rakefile loads
      # the dev bundle.
      - run: |
          ruby -r ./tooling/lib/release - "$TAG" <<'RUBY'
            tag = ARGV.fetch(0)
            shared = Release.shared(Release::VERSION_FILES.map { |file| File.read(file) })
            abort "The gems' versions disagree: #{Release::VERSION_FILES.join(", ")}" unless shared
            abort "#{tag} doesn't match the gems' version, #{shared}" unless tag == "v#{shared}"
          RUBY
      # Mirrors the gem build in rake build.
      - run: |
          mkdir pkg
          for gem in skyward-core skyward-api skyward-orm skyward; do
            (cd "$gem" && gem build --quiet "${gem}.gemspec")
            mv "$gem/$gem"-[0-9]*.gem pkg/
          done
      # RubyGems lets trusted publishing create a new gem only when the token
      # exchange names the account that will own it, and no release of
      # rubygems/configure-rubygems-credentials sends that `owner` yet.
      - name: Exchange the OIDC token for a RubyGems API key
        env:
          # bottrall's RubyGems.org user ID.
          RUBYGEMS_OWNER: "240211"
        shell: bash
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          response=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -sS -X POST -H "Content-Type: application/json" --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          key=$(jq -r '.rubygems_api_key // empty' <<<"$response")
          if [[ -z $key ]]; then
            echo "::error::RubyGems refused the token exchange: ${response}"
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "$GITHUB_ENV"
      # In dependency order, so each gem's exact pins resolve once it's live.
      - run: |
          for gem in skyward-core skyward-api skyward-orm skyward; do
            gem push "pkg/${gem}-${TAG#v}.gem"
          done

  # Runs bin/bench on the code the release tagged. It runs the benchmarks'
  # third-party gems, so it can only read, for the reason verify is split from
  # publish, and attach, which writes, runs none of them. Publishing doesn't
  # wait for it.
  benchmarks:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: benchmarks
      - run: bin/bench
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: tmp/bench/
          if-no-files-found: error

  attach:
    needs: [release-please, benchmarks]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: benchmarks
          path: bench
      - run: |
          mv bench/results.json "benchmarks-${TAG}.json"
          mv bench/results.md "benchmarks-${TAG}.md"
          gh release upload "$TAG" "benchmarks-${TAG}.json" "benchmarks-${TAG}.md" --repo "$GITHUB_REPOSITORY"
