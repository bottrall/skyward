name: pr-title

# PR titles become the squash commits on main, which release-please turns
# into the version bump and changelog, so each must be a Conventional Commit.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
