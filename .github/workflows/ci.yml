name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bundle exec rake lint
          - name: typecheck
            run: bundle exec rake rbs:collection_install typecheck
          - name: tooling
            run: bundle exec rake test:tooling
          # Builds every gem, installs them into an empty GEM_HOME, loads them
          # and runs skyward, which catches a file the gemspec leaves out.
          - name: package
            run: bundle exec rake package:check

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.run }}

  test:
    runs-on: ubuntu-latest
    name: test ${{ matrix.gem }} (ruby ${{ matrix.ruby }})
    # A hung test fails the job in minutes rather than holding it for hours.
    timeout-minutes: 10
    # head is an early warning of the next Ruby's breakages, not a gate.
    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        gem: [skyward-core, skyward-api, skyward, examples/todos]
        # Every Ruby that isn't end-of-life.
        ruby: ["3.3", "3.4", "4.0", head]

    # Each gem's tests run in its own bundle, which holds only the gem and the
    # Skyward gems it depends on, and so does each example's.
    defaults:
      run:
        working-directory: ${{ matrix.gem }}

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rake test

  # The ORM's suite runs on each database it supports, one after the other in
  # one job, so the job keeps the name main's required checks give it. Both
  # runs have PostgreSQL, because the PostgreSQL adapter's own tests always use
  # it, as the SQLite adapter's always use SQLite, so neither skips a test.
  test-orm:
    runs-on: ubuntu-latest
    name: test skyward-orm (ruby ${{ matrix.ruby }})
    timeout-minutes: 10
    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", head]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    defaults:
      run:
        working-directory: skyward-orm

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: skyward-orm
      - name: test on SQLite
        run: bundle exec rake test
        env:
          TEST_DATABASE: sqlite
      # Runs even when SQLite failed, so one push shows both.
      - name: test on PostgreSQL
        if: ${{ !cancelled() }}
        run: bundle exec rake test
        env:
          TEST_DATABASE: postgresql
