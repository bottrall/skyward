name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bin/lint
          - name: typecheck
            run: bin/typecheck
          - name: tooling
            run: bin/test tooling/test
          # Builds every gem, installs them into an empty GEM_HOME, loads them
          # and runs skyward, which catches a file the gemspec leaves out, then
          # runs skyward new and the new app's own bin/ci with them.
          - name: package
            run: bin/build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.run }}

  test:
    runs-on: ubuntu-latest
    name: test ${{ matrix.gem }} (ruby ${{ matrix.ruby }})
    # A hung test fails the job in minutes rather than holding it for hours.
    timeout-minutes: 10
    # head is an early warning of the next Ruby's breakages, not a gate.
    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        gem: [skyward-core, skyward-api, examples/todos]
        # Every Ruby that isn't end-of-life.
        ruby: ["3.3", "3.4", "4.0", head]
        include:
          - gem: skyward-core
            run: bin/test skyward-core/test
          - gem: skyward-api
            run: bin/test skyward-api/test
          - gem: examples/todos
            run: bin/test examples/todos/test

    # Each gem's tests run in its own bundle, which holds only the gem and the
    # Skyward gems it depends on, so both bundles are installed: the dev
    # bundle bin/test's rake runs in, and the gem's, which it runs the tests
    # in. The SQLite example's run in its own bundle too, on an in-memory
    # database of their own.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: ${{ matrix.run }}

  # The suites that use a database, the ORM's and the skyward gem's, run on
  # each database Skyward ORM supports, one after the other in one job, so the
  # job keeps the name main's required checks give it. Both runs have
  # PostgreSQL, because the PostgreSQL adapter's own tests always use it, as
  # the SQLite adapter's always use SQLite, so neither skips a test.
  test-databases:
    runs-on: ubuntu-latest
    name: test ${{ matrix.gem }} (ruby ${{ matrix.ruby }})
    timeout-minutes: 10
    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        gem: [skyward-orm, skyward]
        ruby: ["3.3", "3.4", "4.0", head]
        include:
          - gem: skyward-orm
            run: bin/test skyward-orm/test
          - gem: skyward
            run: bin/test skyward/test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - name: test on SQLite
        run: ${{ matrix.run }}
        env:
          TEST_DATABASE: sqlite
      # Runs even when SQLite failed, so one push shows both.
      - name: test on PostgreSQL
        if: ${{ !cancelled() }}
        run: ${{ matrix.run }}
        env:
          TEST_DATABASE: postgresql

  # The PostgreSQL example's tests run on PostgreSQL alone, which proves the
  # API and the ORM work together in a real app on it, as examples/todos does
  # on SQLite.
  test-todos-postgres:
    runs-on: ubuntu-latest
    name: test examples/todos_postgres (ruby ${{ matrix.ruby }})
    timeout-minutes: 10
    continue-on-error: ${{ matrix.ruby == 'head' }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", head]
        include:
          - run: bin/test examples/todos_postgres/test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # bin/test empties the database TEST_POSTGRES_URL names, then runs the
    # example's tests on it.
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: examples/todos_postgres
      - run: ${{ matrix.run }}

  # Every Skyward app runs skyward check in CI, and so does each example. Its
  # Steep reads the repository's RBS collection, and its strict boot connects,
  # so it needs its database migrated. These run the example's own commands in
  # its own bundle, as an app's CI does, so they aren't bin/ scripts and bin/ci
  # leaves them out.
  check-todos:
    runs-on: ubuntu-latest
    name: skyward check examples/todos
    timeout-minutes: 10

    defaults:
      run:
        working-directory: examples/todos

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: examples/todos
      - run: bundle exec rbs collection install --frozen
      - run: bundle exec skyward migrate
      - run: bundle exec skyward check

  check-todos-postgres:
    runs-on: ubuntu-latest
    name: skyward check examples/todos_postgres
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    defaults:
      run:
        working-directory: examples/todos_postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: examples/todos_postgres
      - run: bundle exec rbs collection install --frozen
      - run: bundle exec skyward migrate
      - run: bundle exec skyward check
