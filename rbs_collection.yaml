sources:
  # Pinned so an upstream push can't break typecheck with no gem change.
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: f7a1647651e333fcb55b7f8a7a4ddec9bcb756c2
    repo_dir: gems

path: .gem_rbs_collection

gems:
  # Each Steep target loads the Skyward gems' signatures it needs from the
  # Steepfile, so none may arrive through the collection.
  - name: skyward
    ignore: true
  - name: skyward-api
    ignore: true
  - name: skyward-core
    ignore: true
  - name: skyward-orm
    ignore: true
  # Ignoring the Skyward gems also drops their dependencies and the standard
  # libraries they require, so name those here.
  - name: rbs
  - name: zeitwerk
  # Without a stdlib source, rbs looks each of these up in Gemfile.lock and
  # warns when it's absent, as a default gem nothing depends on is.
  - name: cgi-escape
    source:
      type: stdlib
  - name: date
    source:
      type: stdlib
  - name: json
    source:
      type: stdlib
  - name: securerandom
    source:
      type: stdlib
  - name: time
    source:
      type: stdlib
  - name: tmpdir
    source:
      type: stdlib
  - name: uri
    source:
      type: stdlib
